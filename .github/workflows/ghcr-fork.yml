name: Publish fork image to GHCR

# Builds this fork's customized image and pushes it to GHCR so servers can
# pull it instead of building from source. Only runs on the fork's own main
# branch; feature branches used for upstream pull requests are untouched.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/new-api

jobs:
  build:
    name: Build & push (${{ matrix.arch }})
    # Skip on the upstream repository so this never runs outside the fork.
    if: github.repository_owner != 'QuantumNous'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version & write VERSION
        id: version
        run: |
          # VERSION is empty in the repository; upstream CI writes the release
          # tag into it at build time. Fork builds are not tagged releases, so
          # derive a traceable identifier from the commit instead.
          TAG="fork-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "${TAG}" > VERSION
          echo "Building ${TAG} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Create multi-arch manifest
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifests
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          for target in "${TAG}" latest; do
            docker buildx imagetools create \
              -t "${IMAGE}:${target}" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
          done

      - name: Summary
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}:latest"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
